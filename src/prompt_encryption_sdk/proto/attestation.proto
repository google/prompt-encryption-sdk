syntax = "proto3";

package prompt_encryption_sdk;

service AttestedTls {
  // AttestConnection performs the post-handshake attestation.
  rpc AttestConnection(AttestConnectionRequest)
      returns (AttestConnectionResponse);
}

// VerifierType defines the supported attestation mechanisms.
enum VerifierType {
  VERIFIER_TYPE_UNSPECIFIED = 0;
  // Google Cloud Attestation (GCA)
  VERIFIER_TYPE_GCA = 1;
}

// AttestationMode is negotiated after the TLS handshake. The zero value is
// intentionally server-only so requests from older clients retain their
// existing behavior.
enum AttestationMode {
  ATTESTATION_MODE_SERVER_ONLY = 0;
  ATTESTATION_MODE_MUTUAL = 1;
}

// AttestationHandshakePhase identifies the two mutual-attestation flights.
enum AttestationHandshakePhase {
  ATTESTATION_HANDSHAKE_PHASE_INITIAL = 0;
  ATTESTATION_HANDSHAKE_PHASE_CLIENT_FINISH = 1;
}

// AttestationPeerRole prevents a proof produced by one side from being
// reflected back and accepted as a proof for the other side.
enum AttestationPeerRole {
  ATTESTATION_PEER_ROLE_UNSPECIFIED = 0;
  ATTESTATION_PEER_ROLE_SERVER = 1;
  ATTESTATION_PEER_ROLE_CLIENT = 2;
}

message AttestConnectionRequest {
  // A list of verifiers that the server must be endorsed by.
  repeated VerifierType required_verifier_type = 1;
  // A random nonce for generating unique TLS session material.
  bytes nonce = 2;
  // Protocol version 0 is the legacy server-only flow. Mutual attestation uses
  // version 1 and fails closed if the peer does not echo it.
  uint32 protocol_version = 3;
  AttestationMode mode = 4;
  AttestationHandshakePhase phase = 5;
  // Opaque identifier issued by the server in the initial mutual response.
  bytes handshake_id = 6;
  // Present only in the mutual CLIENT_FINISH request.
  AttestationProof client_attestation = 7;
}

// GcaTrustBundle contains the materials needed to verify a GCA-based
// attestation.
message GcaTrustBundle {
  // The signed JWT attestation token from GCA.
  string attestation_token = 1;
}

// AttestationEvidence contains the proof of endorsement from a single RoT.
message AttestationEvidence {
  // The type of evidence, must be one requested by the client.
  VerifierType verifier_type = 1;
  // The attestation materials for the RoT.
  oneof trust_bundle {
    GcaTrustBundle gca_bundle = 2;
  }
}

message EcdsaP256PublicKey {
  bytes key_bytes = 1;
}

message MlDsaPublicKey {
  bytes serialized_public_keyset = 1;
}

// SessionSignaturePayload binds the attestation to the TLS session.
// It is signed by the server's private key.
message SessionSignaturePayload {
  // The raw 32-byte SHA-256 hash of the 32-byte Exported Keying Material (EKM)
  // from the TLS session.
  bytes ekm_hash = 1;
  // The raw 32-byte SHA-256 hash of the attestation token.
  bytes token_hash = 2;
  // The following fields are omitted on the wire for legacy server-only
  // proofs, preserving their existing canonical signed payload.
  AttestationPeerRole peer_role = 3;
  AttestationMode mode = 4;
  // SHA-256 of MutualAttestationTranscript for mutual proofs.
  bytes transcript_hash = 5;
}

// AttestationProof is role-neutral evidence that can be produced by either
// endpoint. AttestConnectionResponse retains its original top-level proof
// fields for compatibility with the existing client API.
message AttestationProof {
  repeated AttestationEvidence evidence = 1;
  EcdsaP256PublicKey instance_public_key = 2;
  bytes session_signature = 3;
  MlDsaPublicKey pqc_public_key = 4;
  bytes pqc_session_signature = 5;
}

// Canonical transcript for protocol version 1. Its deterministic serialized
// form is hashed and used both as the EKM context and in each signed proof.
message MutualAttestationTranscript {
  uint32 protocol_version = 1;
  AttestationMode mode = 2;
  bytes client_nonce = 3;
  bytes server_nonce = 4;
  bytes handshake_id = 5;
}

// AttestConnectionResponse is sent by the server to the client. It is sent only
// if the server can satisfy all of the client's required RoTs.
message AttestConnectionResponse {
  // A list of evidence, one for each RoT requested.
  repeated AttestationEvidence evidence = 1;
  // The common public key endorsed by all evidence bundles.
  EcdsaP256PublicKey instance_public_key = 2;
  // signature over a value derived from the TLS session's master secret.
  // This binds the attestation to this specific TLS session.
  bytes session_signature = 3;
  // PQC public key
  MlDsaPublicKey pqc_public_key = 4;
  // PQC signature over the SessionSignaturePayload
  bytes pqc_session_signature = 5;
  // Mutual-attestation negotiation metadata. These fields are default/absent
  // for the legacy server-only flow.
  uint32 protocol_version = 6;
  AttestationMode mode = 7;
  bytes handshake_id = 8;
  bytes server_nonce = 9;
  bool mutual_attestation_complete = 10;
}

// Enum for the supported TEE hardware CPU models.
enum HardwareModel {
  HARDWARE_MODEL_UNSPECIFIED = 0;
  HARDWARE_MODEL_TDX = 1;
  HARDWARE_MODEL_SEV = 2;
  HARDWARE_MODEL_SEV_SNP = 3;
}

// Defines the validation rules for the confidential workload itself.
message WorkloadPolicy {
  // The SHA256 hash of the trusted workload image.
  string image_hash = 1;

  // The resource name of the KMS signing key used to sign the workload image.
  // e.g.,
  // "projects/p/locations/l/keyRings/r/cryptoKeys/k/cryptoKeyVersions/v"
  string signing_key_id = 2;
}

// Defines the expected properties of the GCE instance running the workload.
message GceInstancePolicy {
  string project_id = 1;
  string zone = 2;
  string instance_id = 3;
  string instance_name = 4;
}

// AttestationPolicy defines the rules for validating an attestation report.
message AttestationPolicy {
  // The required TEE hardware model, e.g., "TDX" or "SEV".
  HardwareModel hw_model = 1;
  // The policy that the server workload must satisfy.
  WorkloadPolicy workload = 2;
  // The policy describing the expected GCE instance properties.
  GceInstancePolicy gce_instance = 3;
}
